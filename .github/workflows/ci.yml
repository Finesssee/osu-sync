name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test realm-export
        run: dotnet test tools/realm-export.Tests

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -W clippy::all

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Check (MSRV)
        run: cargo check --workspace

  build-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build with GUI feature
        run: cargo build --features gui --verbose

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish realm-export
        run: dotnet publish tools/realm-export -c Release -o target/release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-sync-windows
          path: |
            target/release/osu-sync.exe
            target/release/realm-export.exe
            target/release/realm-export.dll
            target/release/realm-export.runtimeconfig.json
            target/release/realm-export.deps.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/release/osu-sync.exe
            target/release/realm-export.exe
            target/release/realm-export.dll
            target/release/realm-export.runtimeconfig.json
            target/release/realm-export.deps.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
